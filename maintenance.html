  <script>
    // Parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const circles = document.querySelectorAll('.circle');
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;

      circles.forEach((circle, index) => {
        const speed = (index + 1) * 20;
        const xOffset = (x - 0.5) * speed;
        const yOffset = (y - 0.5) * speed;
        circle.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      });
    });

    // Icon rotation on scroll
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
      const icon = document.querySelector('.icon-container');
      const scrollDiff = window.pageYOffset - lastScroll;
      const currentRotation = parseFloat(icon.style.transform?.match(/rotate\(([^)]+)deg\)/)?.[1] || 0);
      icon.style.transform = `rotate(${currentRotation + scrollDiff * 0.5}deg)`;
      lastScroll = window.pageYOffset;
    });
