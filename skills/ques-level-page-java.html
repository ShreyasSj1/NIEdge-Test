<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Practice Levels - Java</title>

  <!-- Futuristic font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- CSS file -->
  <link rel="stylesheet" href="/skills/assets/css/ques-level-page.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
</head>
<body>
  <!-- Navbar from mp-phy.html -->
  <nav class="navbar" style="will-change: transform">
  <div class="container">
    <a href="#" class="logo">
      <img
        src="/assets/images/LOGO.jpg"
        class="logo-image"
        alt="NIEdge Logo"
      />
    </a>
    <div class="nav-links">
      <a href="/index.html#home">HOME</a>
      <a href="/work-in-progress.html">EVENTS</a>
      <a href="/index.html#academics">ACADEMICS</a>
      <a href="/index.html#skills-new">SKILLS</a>
      <a href="/form.html">FEEDBACK</a>
      <a href="/index.html#about">ABOUT US</a>
    </div>
    <div class="hamburger">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </div>
</nav>

  <main id="px-app">
    <header class="px-header">
      <h1 class="px-title">Practice Questions</h1>
      <span class="px-title-underline" aria-hidden="true"></span>
    </header>

    <!-- Levels board (hidden on phones via CSS) -->
    <section id="px-board" aria-label="Level Path">
      <div id="px-canvas">
        <!-- SVG path -->
        <svg id="px-trace" aria-hidden="true"></svg>
        <!-- Level nodes -->
        <div id="px-nodes"></div>
      </div>
    </section>

    <!-- Mini-map (hidden on phones via CSS) -->
    <aside id="px-minimap" aria-label="Mini map quick navigation">
      <div class="px-minimap-head">Map</div>
      <svg id="px-mini-svg" aria-hidden="true"></svg>
      <div class="px-mini-jumps" id="px-mini-jumps" aria-label="Jump to section"></div>
    </aside>

    <!-- Mobile guard -->
    <section id="px-mobile-guard" aria-live="polite">
      <div class="px-mobile-card">
        <p>For best experience, please use a bigger screen.</p>
      </div>
    </section>
  </main>

  <!-- Levels script -->
  <script src="/skills/assets/js/ques-level-page.js"></script>

  <!-- Navbar script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('active');
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          navLinks.classList.remove('active');
        });
      });

      document.addEventListener('click', function(event) {
        if (!navLinks.contains(event.target) && !hamburger.contains(event.target)) {
          hamburger.classList.remove('active');
          navLinks.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
