<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FRSCNMCS94"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FRSCNMCS94');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CAED - M3</title>
    <link rel="stylesheet" href="/assets/css/caed-notes-choice.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <script src="/assets/js/navbar-loader.js" defer></script>
</head>
<body>
    
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
            <div class="shape shape-6"></div>
        </div>
        <div class="tech-grid"></div>
    </div>

    <div id="navbar-placeholder"></div>
<main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Questions & Solutions<br>CAED - M3</h1>
                <p class="page-subtitle">Choose between Questions and Solutions and download instantly</p>
            </div>

            <div class="notes-grid">
                <a href="https://drive.google.com/file/d/1X1MlDVmf44-p_9Vjz41Rsz6fueKuS2QU/view?usp=drive_link" 
                   class="notes-card" data-type="questions">
                    <div class="notes-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="notes-content">
                        <h3 class="notes-title">Questions</h3>
                    </div>
                    <div class="download-icon">
                        <i class="fas fa-download"></i>
                    </div>
                    <div class="notes-glow"></div>
                </a>

                <div class="notes-card solutions-card">
                    <div class="notes-icon">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <div class="notes-content">
                        <h3 class="notes-title">Solutions</h3>
                    </div>
                    <div class="download-icon">
                        <i class="fas fa-download"></i>
                    </div>
                    <div class="notes-glow"></div>
                    
                    <div class="solutions-options">
                        <div class="solution-option" data-type="dft" 
                             data-url="https://docs.google.com/document/d/18Mi5sIWy5IvRI-NDgD_YZSY_JpjDfKMd/edit?usp=drive_link&ouid=112901548404698452829&rtpof=true&sd=true">
                            <i class="fas fa-wave-square"></i>
                            <span>DFT</span>
                        </div>
                        <div class="solution-option" data-type="pdf" 
                             data-url="https://drive.google.com/file/d/1RCUsG67dokwt2D6xG1kSiqWlcJJ21x1d/view?usp=drive_link">
                            <i class="fas fa-file-pdf"></i>
                            <span>PDF</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="back-section">
                <a href="/mp-caed.html" class="btn back-btn">
                    <i class="fas fa-arrow-left btn-icon"></i>
                    <span>Back to Modules</span>
                </a>
            </div>
        </div>
    </main>

    <script src="/assets/js/caed-notes-choice.js"></script>
